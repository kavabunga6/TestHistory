apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testhistory-worker
  namespace: testhistory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: testhistory-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testhistory-web
  namespace: testhistory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: testhistory-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
