apiVersion: v1
kind: ServiceAccount
metadata:
  name: testhistory-api
  namespace: testhistory
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testhistory-worker
  namespace: testhistory
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testhistory-web
  namespace: testhistory
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testhistory-runtime-readonly
  namespace: testhistory
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testhistory-api-runtime-readonly
  namespace: testhistory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testhistory-runtime-readonly
subjects:
  - kind: ServiceAccount
    name: testhistory-api
    namespace: testhistory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testhistory-worker-runtime-readonly
  namespace: testhistory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testhistory-runtime-readonly
subjects:
  - kind: ServiceAccount
    name: testhistory-worker
    namespace: testhistory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testhistory-web-runtime-readonly
  namespace: testhistory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testhistory-runtime-readonly
subjects:
  - kind: ServiceAccount
    name: testhistory-web
    namespace: testhistory
