apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: testhistory-rabbitmq-data
  namespace: testhistory
  annotations:
    testhistory.io/overlay: "local"
    testhistory.io/parameter.storage-class: "standard"
    testhistory.io/parameter.storage-size: "5Gi"
spec:
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
