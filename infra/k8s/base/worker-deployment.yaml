apiVersion: apps/v1
kind: Deployment
metadata:
  name: testhistory-worker
  namespace: testhistory
  annotations:
    testhistory.io/requires-migration-job: "testhistory-db-migrate"
    testhistory.io/runbook: "docs/operations.md#migrations"
    testhistory.io/dependency-endpoints: "private-only"
    testhistory.io/auth-boundary: "service-audit-only"
    testhistory.io/audit-redaction: "strict"
    testhistory.io/security-audit-sink: "stdout-json"
    testhistory.io/security-audit-events: "security.audit.worker,security.audit.cleanup,security.audit.retention"
    testhistory.io/security-audit-retention-policy: "bounded-placeholder"
    testhistory.io/security-audit-export-policy: "redacted-manual-placeholder"
    testhistory.io/security-audit-export-lifecycle: "placeholder-state-only"
    testhistory.io/security-audit-export-replay-probe: "read-only-provider-neutral"
    testhistory.io/security-audit-export-invariant-probe: "read-only-provider-neutral"
    testhistory.io/security-audit-export-materialized-invariant-read: "provider-neutral-secret-free"
    testhistory.io/attachment-preview-retention-descriptor: "dry-run-redacted"
    testhistory.io/attachment-preview-retention-execution: "none-dry-run"
    testhistory.io/security-audit-export-secret-ref: "testhistory-security-audit-export"
    testhistory.io/probe-classification: "worker.health.synthetic"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testhistory-worker
  template:
    metadata:
      labels:
        app: testhistory-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: testhistory-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: testhistory-runtime
            - configMapRef:
                name: testhistory-security-audit-policy
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: RABBITMQ_URL
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: S3_SECRET_ACCESS_KEY
            - name: SECURITY_AUDIT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: SECURITY_AUDIT_SIGNING_KEY
            - name: TESTHISTORY_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: TESTHISTORY_WORKER_TOKEN
            - name: SECURITY_AUDIT_SINK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: SECURITY_AUDIT_SINK_TOKEN
            - name: SECURITY_AUDIT_EXPORT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: testhistory-security-audit-export
                  key: SECURITY_AUDIT_EXPORT_ENDPOINT
            - name: SECURITY_AUDIT_EXPORT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: testhistory-security-audit-export
                  key: SECURITY_AUDIT_EXPORT_CLIENT_ID
            - name: SECURITY_AUDIT_EXPORT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: testhistory-security-audit-export
                  key: SECURITY_AUDIT_EXPORT_CLIENT_SECRET
            - name: SECURITY_AUDIT_EXPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: testhistory-security-audit-export
                  key: SECURITY_AUDIT_EXPORT_TOKEN
            - name: SECURITY_AUDIT_EXPORT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: testhistory-security-audit-export
                  key: SECURITY_AUDIT_EXPORT_ENCRYPTION_KEY
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -n "$DATABASE_URL"
                  test -n "$REDIS_URL"
                  test -n "$RABBITMQ_URL"
                  test -n "$S3_ENDPOINT"
                  test -n "$S3_BUCKET"
                  test -n "$TESTHISTORY_API_URL"
                  test -n "$TESTHISTORY_WORKER_TOKEN"
                  test "$WORKER_HEARTBEAT_MS" -gt 0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -n "$DATABASE_URL"
                  test -n "$REDIS_URL"
                  test -n "$RABBITMQ_URL"
                  test -n "$S3_ENDPOINT"
                  test -n "$S3_BUCKET"
                  test -n "$TESTHISTORY_API_URL"
                  test -n "$TESTHISTORY_WORKER_TOKEN"
                  test "$WORKER_HEARTBEAT_MS" -gt 0
                  node -e "fetch(new URL('/health', process.env.TESTHISTORY_API_URL)).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - cat /proc/1/comm | grep -q node
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
