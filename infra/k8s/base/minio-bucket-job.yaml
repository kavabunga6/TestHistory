apiVersion: batch/v1
kind: Job
metadata:
  name: testhistory-minio-bucket-init
  namespace: testhistory
  annotations:
    testhistory.io/purpose: "placeholder bucket init for MinIO or S3-compatible storage"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: testhistory-minio-bucket-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          imagePullPolicy: IfNotPresent
          env:
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: testhistory-runtime
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: testhistory-runtime
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: testhistory-runtime
                  key: S3_SECRET_ACCESS_KEY
          command:
            - /bin/sh
            - -ec
            - |
              mc alias set artifact "$S3_ENDPOINT" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" --api S3v4
              mc mb --ignore-existing "artifact/$S3_BUCKET"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
