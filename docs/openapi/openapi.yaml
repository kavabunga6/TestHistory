      description: Applies supported SCIM replace operations to project membership activity, display name, or assigned project role.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              properties:
