  /api/v1/security/audit/export/evaluate:
    post:
      tags: [security]
      operationId: evaluateSecurityAuditExportPolicy
      description: Read-only evaluation of a security audit export request against a supplied policy. The route returns a deterministic, redacted decision and never starts an export, resolves credentials, contacts providers, or stores export artifacts.
      parameters:
        - name: X-TestHistory-Scopes
          in: header
          required: true
          schema:
            type: string
          description: Must include `security:audit:read`.
        - name: X-TestHistory-Project-Scope
          in: header
          required: true
          schema:
            type: string
          description: Must include the request project id or `*`.
        - name: X-TestHistory-Actor-Id
          in: header
          required: true
          schema:
            type: string
          description: Must match the request actor id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityAuditExportPolicyEvaluationRequest"
            example:
              request:
                projectId: project-security-audit
                actorId: actor-security-admin
                requestedAt: "2026-05-30T08:00:00.000Z"
                range:
                  from: "2026-05-01T00:00:00.000Z"
                  to: "2026-05-08T00:00:00.000Z"
                destination:
                  type: placeholder
                  secretRef: audit-export-placeholder-ref
                format: jsonl
                criteria:
                  eventTypes: [auth.login.failed, auth.access.denied]
                  outcome: denied
              policy:
                enabled: true
                maxRangeDays: 14
                allowedProjectIds: [project-security-audit]
                allowedActorIds: [actor-security-admin]
      responses:
        "200":
          description: Redacted read-only security audit export policy decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityAuditExportPolicyEvaluation"
        "400":
          description: Invalid export evaluation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing security audit read scope, project access, or actor scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Project not found
