      summary: Unlink one automated result occurrence from a computed defect
      description: Appends a project-scoped unlink event without mutating the imported Allure result.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: defectId
          in: path
          required: true
          schema: { type: string }
        - name: resultUuid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                launchId: { type: string, maxLength: 200 }
                reason: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Result occurrence unlinked from the active defect projection }
