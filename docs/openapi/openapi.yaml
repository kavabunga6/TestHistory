  /api/v1/uploads/{uploadId}/process:
    post:
      tags: [uploads]
      operationId: processQueuedChunkedUploadJob
      description: Worker-compatible processing boundary for a queued or claimed chunked-session upload job. Workers should claim jobs through `/api/v1/uploads/jobs/claim` and pass the returned claim token here; legacy queued jobs without a lease remain processable for compatibility.
