  /api/v1/artifacts:
    get:
      tags: [artifacts]
      operationId: listArtifacts
      description: Lists redacted artifact descriptors without raw payloads, local paths, storage keys, or signed URLs.
      parameters:
        - name: launchId
          in: query
          required: false
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                allure-result,
                allure-container,
                attachment,
                fixture,
                scenario,
                environment,
                executor,
                unknown
              ]
        - name: limit
          in: query
          required: false
          description: Enables the paginated artifact-list read model. Omit for legacy array response.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Artifact descriptors. Requests with limit/cursor return a paginated read model; legacy requests without pagination controls return an array.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/ArtifactDescriptor"
                  - $ref: "#/components/schemas/ArtifactList"
  /api/v1/artifacts/{artifactId}/preview:
    get:
      tags: [artifacts]
      operationId: getArtifactTextPreview
      description: Returns a bounded, redacted UTF-8 preview for authorized text, JSON, XML, and log artifacts up to 3 MiB. Binary, unsupported, or oversized content is never returned to the browser.
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bounded and redacted artifact text preview descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactTextPreview"
        "403":
          description: Missing artifact read scope or project access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Artifact descriptor, project, or physical content not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "413":
          description: Artifact exceeds the browser preview limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPreviewTooLargeError"
        "415":
          description: Artifact content type is not safe for browser text preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/v1/artifacts/{artifactId}/content:
    get:
      tags: [artifacts]
      operationId: getArtifactContent
      description: Streams stored artifact content to an authorized project reader without exposing the storage key or provider location.
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored artifact bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Missing artifact read scope or project access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Artifact descriptor, project, or physical content not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
  /api/v1/artifacts/upload-policy:
    get:
      tags: [artifacts]
      operationId: getArtifactUploadPolicy
      description: Returns artifact upload limits, retention hints, and redaction policy metadata.
      responses:
        "200":
          description: Artifact upload limits and per-field metadata source policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUploadPolicy"
  /api/v1/launches/{launchId}/attachment-previews/retention/preview:
    get:
      tags: [artifacts]
      operationId: previewAttachmentPreviewRetention
      description: Read-only, launch-scoped preview of attachment preview descriptor retention eligibility. The launch must be closed, the caller must have artifact read access for the launch project, and the response is paginated and redacted; descriptor bodies, artifact paths, checksums, storage keys, signed URLs, tokens, deletion targets, provider actions, and raw blobs are never returned or executed.
      parameters:
        - name: launchId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Offset cursor returned by a previous page.
        - name: batchSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Page-scoped dry-run batch size. It never requests or executes deletion.
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AttachmentPreviewRetentionStatus"
        - name: X-TestHistory-Scopes
          in: header
          required: true
          schema:
            type: string
          description: Must include `artifacts:read`.
        - name: X-TestHistory-Project-Scope
          in: header
          required: true
          schema:
            type: string
          description: Must include the launch project id or `*`.
      responses:
        "200":
          description: Paginated attachment preview descriptor retention eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentPreviewRetentionPreview"
        "400":
          description: Invalid pagination cursor or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedactedError"
        "403":
          description: Missing artifact read scope or project access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Launch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "409":
          description: Launch is not closed, so retention eligibility is not exposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentPreviewRetentionLaunchStateError"
  /api/v1/launches/{launchId}/attachment-previews/retention/dry-run/schedule:
    get:
      tags: [artifacts]
      operationId: readAttachmentPreviewRetentionDryRunScheduleDescriptors
      description: Read-only, launch-scoped descriptor schedule read for attachment preview retention dry-runs. The launch must be closed, the caller must have artifact read access for the launch project, and the response is paginated and redacted; raw descriptor bodies, artifact paths, storage keys, provider mutation handles, signed URLs, tokens, deletion targets, deletion execution, provider actions, and raw blobs are never returned or executed.
      parameters:
        - name: launchId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Offset cursor returned by a previous page.
        - name: scheduleDigest
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-f0-9]{24}$
          description: Optional descriptor schedule digest filter.
        - name: scheduleSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Maximum descriptor refs represented by each schedule descriptor. It never requests or executes deletion.
        - name: X-TestHistory-Scopes
          in: header
          required: true
          schema:
            type: string
          description: Must include `artifacts:read`.
        - name: X-TestHistory-Project-Scope
          in: header
          required: true
          schema:
            type: string
          description: Must include the launch project id or `*`.
        - name: X-TestHistory-Actor-Id
          in: header
          required: false
          schema:
            type: string
          description: Optional actor id for audit scoping; unsafe token-like values are redacted.
      responses:
        "200":
          description: Paginated attachment preview retention dry-run schedule descriptors
          content:
            application/json:
              schema:
