        "403":
          description: Missing enterprise access management permission
        "404":
          description: Project not found
  /api/scim/v2/projects/{projectId}/Users:
    get:
      tags: [security]
      operationId: listProjectScimUsers
      description: Lists project memberships provisioned through the SCIM 2.0 Users resource with bounded pagination and exact userName filtering.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: startIndex
          in: query
          schema: { type: integer, minimum: 1 }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: filter
          in: query
          schema: { type: string, maxLength: 500 }
      responses:
        "200":
          description: SCIM 2.0 ListResponse with redacted project users
        "401":
          description: SCIM bearer token is invalid
        "404":
          description: Project not found
    post:
      tags: [security]
      operationId: provisionProjectScimUser
      description: Provisions one project membership from a SCIM 2.0 User resource and records the service action in the security audit stream.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              required: [userName]
              properties:
                userName: { type: string, minLength: 1, maxLength: 320 }
                externalId: { type: string, maxLength: 320 }
                displayName: { type: string, maxLength: 320 }
                active: { type: boolean }
                emails: { type: array, maxItems: 10, items: { type: object } }
                roles: { type: array, maxItems: 10, items: {} }
      responses:
        "201":
          description: Provisioned SCIM User resource
        "401":
          description: SCIM bearer token is invalid
        "409":
          description: SCIM user already exists
  /api/scim/v2/projects/{projectId}/Users/{userId}:
    patch:
      tags: [security]
