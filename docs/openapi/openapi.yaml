            name: kind,
            required: true,
            schema: { type: string, enum: [notifications, issue-trackers] }
          }
        - { in: path, name: integrationId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Updated redacted integration }
    delete:
      tags: [integrations]
      operationId: deleteOutboundIntegration
      description: Removes a project notification or issue-tracker integration.
      parameters:
        - { in: path, name: projectId, required: true, schema: { type: string } }
        - {
            in: path,
            name: kind,
            required: true,
            schema: { type: string, enum: [notifications, issue-trackers] }
          }
        - { in: path, name: integrationId, required: true, schema: { type: string } }
      responses:
        "200": { description: Integration removed }
  /api/v1/projects/{projectId}/integration-deliveries:
    get:
      tags: [integrations]
      operationId: listIntegrationDeliveries
      description: Lists redacted delivery-state records from the project integration outbox.
      parameters:
        - { in: path, name: projectId, required: true, schema: { type: string } }
      responses:
        "200": { description: Redacted integration delivery list }
  /api/v1/projects/{projectId}/issues:
    post:
      tags: [integrations]
      operationId: createExternalIssue
      description: Queues and optionally dispatches a durable issue creation request to a configured tracker.
      parameters:
        - { in: path, name: projectId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Redacted issue delivery receipt }
  /api/v1/integrations/deliveries/dispatch:
    post:
      tags: [integrations]
      operationId: dispatchIntegrationDeliveries
      description: Claims and dispatches a bounded outbox batch for an authenticated TestHistory worker.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Bounded integration delivery dispatch result }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session or API token
      description: >
        Use `Authorization: Bearer <session-or-personal-token>`. Project API tokens may also
        require `x-testhistory-project-scope` and `x-testhistory-scopes` headers.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^[A-Za-z0-9_-]+$"
        name:
          type: string
          minLength: 1
          maxLength: 160
    LaunchCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        branch:
          type: string
        commitSha:
          type: string
        buildNumber:
          type: string
    QueryRequest:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        thql:
          type: string
          maxLength: 2000
          description: THQL expression for Jira-like flexible filtering.
        query:
          $ref: "#/components/schemas/QuerySpec"
    QuerySpec:
      type: object
      additionalProperties: false
      properties:
        entity:
          type: string
          enum: [launches, results, testCases]
          default: launches
        projectId:
          type: string
        launchId:
          type: string
        filters:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: array
                items:
                  type: string
        metrics:
          type: array
          items:
            type: string
        groupBy:
          type: array
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
    QueryValidationResult:
      type: object
      required: [kind, valid, errors, normalized, capabilities]
      properties:
        kind:
          type: string
          enum: [query-validation]
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: "#/components/schemas/QueryValidationError"
        normalized:
          $ref: "#/components/schemas/QuerySpec"
        capabilities:
          type: object
          additionalProperties: true
    QueryValidationError:
      type: object
      required: [code, message, path]
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
    QueryPreviewResult:
      type: object
      required: [kind, valid, query, page, rows]
      properties:
        kind:
          type: string
          enum: [query-preview]
        valid:
          type: boolean
        query:
          $ref: "#/components/schemas/QuerySpec"
        page:
          type: object
          required: [limit, returned, truncated]
          properties:
            limit:
              type: integer
            returned:
              type: integer
            truncated:
              type: boolean
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    AnalyticsRunResult:
      type: object
      required: [kind, valid, query, result]
      properties:
        kind:
          type: string
          enum: [analytics-run]
        valid:
          type: boolean
        query:
          $ref: "#/components/schemas/QuerySpec"
        result:
          type: object
          required: [rowCount, metrics, groups]
          properties:
            rowCount:
              type: integer
            metrics:
              type: object
              additionalProperties: true
            groups:
              type: array
              items:
                type: object
                required: [key, count]
                properties:
                  key:
                    type: object
                    additionalProperties: true
                  count:
                    type: integer
    ThqlFilterScope:
      type: string
      enum: [global, personal, project]
    ThqlFilterEntity:
      type: string
      enum: [defects, launchResults, launches, testCases]
    ThqlSavedFilter:
      type: object
      additionalProperties: false
      required: [createdAt, createdBy, entity, id, name, query, scope, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        query:
          type: string
        scope:
          $ref: "#/components/schemas/ThqlFilterScope"
        entity:
          $ref: "#/components/schemas/ThqlFilterEntity"
        description:
          type: string
        projectId:
          type: string
        ownerId:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ThqlFilterList:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [thql-filter-list]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ThqlSavedFilter"
    ThqlFilterCreateRequest:
      type: object
      additionalProperties: false
      required: [entity, name, query, scope]
      properties:
        name:
          type: string
        query:
          type: string
        scope:
          $ref: "#/components/schemas/ThqlFilterScope"
        entity:
          $ref: "#/components/schemas/ThqlFilterEntity"
        description:
          type: string
        projectId:
          type: string
          description: Required when `scope` is `project`.
    ThqlFilterCreated:
      type: object
      additionalProperties: false
      required: [kind, filter]
      properties:
        kind:
          type: string
          enum: [thql-filter-created]
        filter:
          $ref: "#/components/schemas/ThqlSavedFilter"
    ThqlFilterDeleted:
      type: object
      additionalProperties: false
      required: [kind, filterId]
      properties:
        kind:
          type: string
          enum: [thql-filter-deleted]
        filterId:
          type: string
    DashboardCreate:
      type: object
      required: [projectId, name]
      additionalProperties: false
      properties:
        projectId:
          type: string
        name:
          type: string
        description:
          type: string
    DashboardPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
    Dashboard:
      allOf:
        - $ref: "#/components/schemas/DashboardCreate"
        - type: object
          required: [id, createdAt, updatedAt, widgets]
          properties:
            id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            widgets:
              type: array
              items:
                $ref: "#/components/schemas/Widget"
    DashboardList:
      type: object
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [dashboard-list]
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dashboard"
    WidgetCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
        type:
          type: string
          enum: [metric, table, chart]
          default: metric
        query:
          type: object
          additionalProperties: true
        layout:
          type: object
          additionalProperties: true
    WidgetPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        type:
          type: string
          enum: [metric, table, chart]
        query:
          type: object
          additionalProperties: true
        layout:
          type: object
          additionalProperties: true
    Widget:
      allOf:
        - $ref: "#/components/schemas/WidgetCreate"
        - type: object
          required: [id, dashboardId, createdAt, updatedAt]
          properties:
            id:
              type: string
            dashboardId:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    WidgetList:
      type: object
      required: [kind, dashboardId, items]
      properties:
        kind:
          type: string
          enum: [widget-list]
        dashboardId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Widget"
    ProjectArtifactSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        attachmentRetentionDays:
          type: integer
          minimum: 1
          maximum: 3650
        cleanupGraceDays:
          type: integer
          minimum: 0
          maximum: 365
        compressRetainedTextArtifacts:
          type: boolean
        deleteBinaryArtifactsAfterRetention:
          type: boolean
        retentionPolicies:
          type: array
          items:
            $ref: "#/components/schemas/ProjectArtifactRetentionPolicy"
    ProjectArtifactRetentionPolicy:
      type: object
      required: [id, artifact, passedDays, failedDays, quarantinedDays, maxSizeMb]
      properties:
        id:
          type: string
        artifact:
          type: string
        passedDays:
          type: integer
          minimum: 0
        failedDays:
          type: integer
          minimum: 0
        quarantinedDays:
          type: integer
          minimum: 0
        maxSizeMb:
          type: integer
          minimum: 1
    ProjectArtifactRetentionSettings:
      type: object
      required:
        [
          attachmentRetentionDays,
          cleanupGraceDays,
          compressRetainedTextArtifacts,
          deleteBinaryArtifactsAfterRetention
        ]
      properties:
        attachmentRetentionDays:
          type: integer
          minimum: 1
        cleanupGraceDays:
          type: integer
          minimum: 0
        compressRetainedTextArtifacts:
          type: boolean
        deleteBinaryArtifactsAfterRetention:
          type: boolean
        retentionPolicies:
          type: array
          items:
            $ref: "#/components/schemas/ProjectArtifactRetentionPolicy"
        updatedAt:
          type: string
          format: date-time
    ProjectArtifactSettingsReadModel:
      type: object
      required: [kind, projectId, source, retention, effectivePolicy, cleanup]
      properties:
        kind:
          type: string
          enum: [project-artifact-settings]
        projectId:
          type: string
        source:
          type: string
          enum: [default, project]
        retention:
          $ref: "#/components/schemas/ProjectArtifactRetentionSettings"
        retentionPolicies:
          type: array
          items:
            $ref: "#/components/schemas/ProjectArtifactRetentionPolicy"
        effectivePolicy:
          type: object
          additionalProperties: true
        cleanup:
          type: object
          required:
            [
              dryRunEndpoint,
              defaultRetentionDays,
              stagedBeforeDelete,
              deleteBinaryArtifactsAfterRetention,
              compressRetainedTextArtifacts
            ]
          properties:
            dryRunEndpoint:
              type: string
            defaultRetentionDays:
              type: integer
              enum: [14]
            stagedBeforeDelete:
              type: boolean
            deleteBinaryArtifactsAfterRetention:
              type: boolean
            compressRetainedTextArtifacts:
              type: boolean
    ProjectRole:
      type: string
      enum: [owner, maintainer, editor, viewer, ci]
    AuthRegisterRequest:
      type: object
      required: [email, name, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 8
    AuthLoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CurrentUser:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time
    AuthSessionResponse:
      type: object
      required: [kind, user, session]
      properties:
        kind:
          type: string
          enum: [auth-session]
        user:
          $ref: "#/components/schemas/CurrentUser"
        session:
          type: object
          required: [id, token, expiresAt]
          properties:
            id:
              type: string
            token:
              type: string
              description: Raw session token returned only in login/register responses.
            expiresAt:
              type: string
              format: date-time
    CurrentUserResponse:
      type: object
      required: [kind, user, auth]
      properties:
        kind:
          type: string
          enum: [current-user]
        user:
          $ref: "#/components/schemas/CurrentUser"
        auth:
          type: object
          required: [method]
          properties:
            method:
              type: string
              enum: [session, personal-token]
    PersonalApiToken:
      type: object
      description: Redacted personal token metadata. Raw token secrets and secret hashes are never returned by read/revoke endpoints.
      required: [id, name, prefix, fingerprint, status, scopes, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        fingerprint:
          type: string
        status:
          type: string
          enum: [active, revoked]
        scopes:
          type: array
          items:
            type: string
            enum: [profile:read, tokens:read, tokens:write]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    PersonalApiTokenCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [profile:read, tokens:read, tokens:write]
        expiresAt:
          type: string
          format: date-time
    PersonalApiTokenCreateResponse:
      type: object
      required: [kind, token, secret, secretShownOnce]
      properties:
        kind:
          type: string
          enum: [personal-api-token-created]
        token:
          $ref: "#/components/schemas/PersonalApiToken"
        secret:
          type: string
          description: One-time raw personal token secret.
        secretShownOnce:
          type: boolean
          enum: [true]
    PersonalApiTokenList:
      type: object
      required: [kind, items]
      properties:
        kind:
          type: string
          enum: [personal-api-token-list]
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalApiToken"
    PersonalApiTokenRevokeResponse:
      type: object
      required: [kind, token]
      properties:
        kind:
          type: string
          enum: [personal-api-token-revoked]
        token:
          $ref: "#/components/schemas/PersonalApiToken"
    ProjectApiTokenScope:
      type: string
      enum:
        [
          mcp:discover,
          projects:read,
          projects:write,
          launches:read,
          launches:write,
          uploads:read,
          uploads:write,
          results:read,
          results:write,
          test-cases:read,
          test-cases:write,
          artifacts:read,
          artifacts:write,
          analytics:read,
          dashboards:read,
          dashboards:write,
          defects:read,
          defects:write,
          quarantine:write,
          settings:read,
          settings:write,
          exports:read,
          security:audit:read,
          quality-gates:evaluate
        ]
    ProjectMembership:
      type: object
      required: [id, subject, displayName, role, source, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        subject:
          type: string
        displayName:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
        source:
          type: string
          enum: [manual, sso, scim, token]
        status:
          type: string
          enum: [active, invited, disabled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
    ProjectApiTokenMetadata:
      type: object
      description: Redacted API token metadata. Raw token secrets and secret hashes are never returned by read or revoke endpoints.
      required:
        [
          id,
          name,
          prefix,
          fingerprint,
          ownerSubject,
          createdBy,
          scopes,
          status,
          createdAt,
          updatedAt
        ]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: Non-secret token prefix suitable for operator identification.
        fingerprint:
          type: string
          description: Short non-secret SHA-256 fingerprint of the one-time secret.
        ownerSubject:
          type: string
        createdBy:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ProjectApiTokenScope"
        status:
          type: string
          enum: [active, expired, revoked]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          type: string
    ProjectVisibilityPolicy:
      type: object
      required: [id, label, description, mode, owner, updatedAt]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [enabled, limited, blocked]
        owner:
          type: string
        updatedAt:
          type: string
          format: date-time
    ProjectIntegrationLinkProvider:
      type: object
      required:
        [id, enabled, name, preset, source, baseUrl, suffixTemplate, encodeSuffix, updatedAt]
      properties:
        id:
          type: string
        enabled:
          type: boolean
        name:
          type: string
        preset:
          type: string
          enum: [jira, youtrack, github, linear, testrail, custom]
        source:
          type: object
          required: [kind, matchMode]
          properties:
            kind:
              type: string
              enum:
                [label, customField, issue, testKey, link, testCaseId, historyId, fullName, name]
            name:
              type: string
            matchMode:
              type: string
              enum: [first, all, regex]
            regex:
              type: string
        baseUrl:
          type: string
          format: uri
          description: HTTPS link prefix without credentials or token-like query parameters.
        suffixTemplate:
          type: string
          description: URL suffix template. Must include `{value}`.
        encodeSuffix:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    ProjectCustomFieldMapping:
      type: object
      required: [id, field, source, required, updatedAt]
      properties:
        id:
          type: string
        field:
          type: string
        source:
          type: string
        fallback:
          type: string
        required:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    ProjectAccessSettingsReadModel:
      type: object
      required:
        [
          kind,
          project,
          schemaVersion,
          updatedAt,
          memberships,
          apiTokens,
          visibilityPolicies,
          integrationProviders,
          customFieldMappings
        ]
      properties:
        kind:
          type: string
          enum: [project-access-settings]
        project:
          type: object
          required: [id, key, name, visibility]
          properties:
            id:
              type: string
            key:
              type: string
            name:
              type: string
            visibility:
              type: string
              enum: [private, internal, public-demo]
        schemaVersion:
          type: integer
          enum: [1]
        updatedAt:
          type: string
          format: date-time
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
        apiTokens:
          type: array
          items:
            $ref: "#/components/schemas/ProjectApiTokenMetadata"
        visibilityPolicies:
          type: array
          items:
            $ref: "#/components/schemas/ProjectVisibilityPolicy"
        integrationProviders:
          type: array
          items:
            $ref: "#/components/schemas/ProjectIntegrationLinkProvider"
        customFieldMappings:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCustomFieldMapping"
    ProjectAccessSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        visibility:
          type: string
          enum: [private, internal, public-demo]
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
        visibilityPolicies:
          type: array
          items:
            $ref: "#/components/schemas/ProjectVisibilityPolicy"
        integrationProviders:
          type: array
          items:
            $ref: "#/components/schemas/ProjectIntegrationLinkProvider"
        customFieldMappings:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCustomFieldMapping"
    ProjectApiTokenCreateRequest:
      type: object
      required: [name, ownerSubject, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        ownerSubject:
          type: string
          minLength: 1
          maxLength: 160
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProjectApiTokenScope"
        expiresAt:
          type: string
          format: date-time
    ProjectApiTokenCreateResponse:
      type: object
      required: [kind, projectId, token, secret, secretShownOnce]
      properties:
        kind:
          type: string
          enum: [project-api-token-created]
        projectId:
          type: string
        token:
          $ref: "#/components/schemas/ProjectApiTokenMetadata"
        secret:
          type: string
          description: One-time raw secret returned only on token creation.
        secretShownOnce:
          type: boolean
          enum: [true]
    ProjectApiTokenRevokeResponse:
      type: object
      required: [kind, projectId, token]
      properties:
        kind:
          type: string
          enum: [project-api-token-revoked]
        projectId:
          type: string
        token:
          $ref: "#/components/schemas/ProjectApiTokenMetadata"
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LaunchPaginationValidationError:
      type: object
      required: [code, message, redacted]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [launch.pagination.invalid]
        message:
          type: string
        redacted:
          type: boolean
          enum: [true]
    AllureStatus:
      type: string
      enum: [failed, broken, passed, skipped, unknown]
    LaunchStatus:
      type: string
      enum: [open, processing, closed, failed, archived]
    LaunchClosePipelineStatus:
      type: string
      enum: [pending_uploads, processing, closed, failed]
    StatusCounters:
      type: object
      required: [failed, broken, passed, skipped, unknown]
      properties:
        failed:
          type: integer
          minimum: 0
        broken:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        skipped:
