openapi: 3.1.0
info:
  title: TestHistory API
  version: 0.1.0
  description: API for an Allure-compatible Test Intelligence Platform.
servers:
  - url: http://127.0.0.1:18080
    description: Local Docker Compose host-facing API
  - url: http://localhost:8080
    description: Container or in-cluster API port
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      description: Returns a lightweight API health probe for local, Docker, Kubernetes, and load-smoke checks.
      responses:
        "200":
          description: Service health
        "503":
          description: Service is degraded or unavailable because persistence is not writable, not migrated, or cannot be reached
      security: []
  /docs:
    get:
      tags: [system]
      operationId: getSwaggerUi
      description: Serves the interactive Swagger UI backed by the runtime OpenAPI document.
      responses:
        "200":
          description: Swagger UI
      security: []
  /docs/json:
    get:
      tags: [system]
      operationId: getRuntimeOpenApiJson
      description: Returns the runtime OpenAPI JSON document generated by the API process for parity checks.
      responses:
        "200":
          description: Runtime OpenAPI JSON document
      security: []
  /api/v1/capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      description: Returns API capabilities, upload limits, module availability, and documentation links for clients.
      responses:
        "200":
          description: Service capabilities, ingestion policy, and MCP information
      security: []
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      description: Creates a local user and returns a session token once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: User created and session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid registration request
        "409":
          description: User already exists
      security: []
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      description: Authenticates a local user and returns a session token once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Invalid email or password
      security: []
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      description: Returns the current authenticated user for a session or personal bearer token.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Authentication required
  /api/v1/auth/tokens:
    get:
      tags: [auth]
      operationId: listPersonalApiTokens
      description: Lists redacted personal API token metadata for the current user.
      responses:
        "200":
          description: Personal token list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalApiTokenList"
        "401":
          description: Authentication required
    post:
      tags: [auth]
      operationId: createPersonalApiToken
      description: Creates a personal API token. The raw secret is returned only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalApiTokenCreateRequest"
      responses:
        "201":
          description: Personal token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalApiTokenCreateResponse"
        "400":
          description: Invalid token request
        "401":
          description: Authentication required
  /api/v1/auth/tokens/{tokenId}:
    delete:
      tags: [auth]
      operationId: revokePersonalApiToken
      description: Revokes one personal API token owned by the current user.
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Personal token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalApiTokenRevokeResponse"
        "401":
          description: Authentication required
        "404":
          description: Token not found
  /api/v1/query/validate:
    post:
      tags: [query]
      operationId: validateQuery
      description: Validates the minimal dashboard/query read model without mutating stored data.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query validation result with normalized query and supported capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryValidationResult"
      security: []
  /api/v1/query/preview:
    post:
      tags: [query]
      operationId: previewQuery
      description: Returns a bounded read-only preview over in-memory launches, results, or test cases.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query preview rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryPreviewResult"
        "400":
          description: Invalid query
        "403":
          description: Actor or API token is not allowed to read analytics data
        "404":
          description: Project or launch not found
  /api/v1/analytics/run:
    post:
      tags: [analytics]
      operationId: runAnalytics
      description: Runs minimal read-only analytics over the query read model.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Analytics counters and optional groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsRunResult"
        "400":
          description: Invalid query
        "403":
          description: Actor or API token is not allowed to read analytics data
        "404":
          description: Project or launch not found
  /api/v1/thql/filters:
    get:
      tags: [query]
      operationId: listThqlFilters
      description: Lists THQL saved filters visible to the current actor. Global filters are visible to everyone, project filters require project settings read access, and personal filters are returned only for their owner.
      parameters:
        - name: entity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ThqlFilterEntity"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: Project scope for project filters. Requires `settings:read` and matching project scope headers.
        - name: X-TestHistory-Scopes
          in: header
          required: false
          schema:
            type: string
          description: Include `settings:read` when `projectId` is supplied.
        - name: X-TestHistory-Project-Scope
          in: header
          required: false
          schema:
            type: string
          description: Include the requested project id or `*` when `projectId` is supplied.
        - name: X-TestHistory-Actor-Id
          in: header
          required: false
          schema:
            type: string
          description: Actor fallback for project-scoped and personal reads when no bearer session is present.
      responses:
        "200":
          description: Visible THQL saved filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThqlFilterList"
        "403":
          description: Actor or API token is not allowed to read project filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Project not found
    post:
      tags: [query]
      operationId: createThqlFilter
      description: Creates a THQL saved filter. Personal filters require an authenticated actor, project filters require project owner settings write access, and global filters require a global admin bearer session.
      parameters:
        - name: X-TestHistory-Scopes
          in: header
          required: false
          schema:
            type: string
          description: Include `settings:write` for project-scoped filters.
        - name: X-TestHistory-Project-Scope
          in: header
          required: false
          schema:
            type: string
          description: Include the requested project id or `*` for project-scoped filters.
        - name: X-TestHistory-Actor-Id
          in: header
          required: false
          schema:
            type: string
          description: Actor fallback for personal and project-scoped filters when no bearer session is present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThqlFilterCreateRequest"
      responses:
        "201":
          description: THQL saved filter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThqlFilterCreated"
        "400":
          description: Invalid THQL filter request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
        "403":
          description: Actor is not allowed to create this filter scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Project not found
  /api/v1/thql/filters/{filterId}:
    delete:
      tags: [query]
      operationId: deleteThqlFilter
      description: Deletes a user-created THQL saved filter. Built-in filters are not stored by this endpoint. Personal filters can be deleted only by the owner, project filters by project owners with settings write access, and global filters only by global admins.
      parameters:
        - name: filterId
          in: path
          required: true
          schema:
            type: string
        - name: X-TestHistory-Scopes
          in: header
          required: false
          schema:
            type: string
          description: Include `settings:write` for project-scoped filters.
        - name: X-TestHistory-Project-Scope
          in: header
          required: false
          schema:
            type: string
          description: Include the requested project id or `*` for project-scoped filters.
        - name: X-TestHistory-Actor-Id
          in: header
          required: false
          schema:
            type: string
          description: Actor fallback for personal and project-scoped filters when no bearer session is present.
      responses:
        "200":
          description: THQL saved filter deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThqlFilterDeleted"
        "401":
          description: Authentication required
        "403":
          description: Actor is not allowed to delete this filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: THQL filter not found
  /api/v1/dashboards:
    get:
      tags: [dashboards]
      operationId: listDashboards
      description: Lists project dashboards with bounded widget metadata for the current actor scope.
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Dashboard list with embedded widget skeletons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardList"
        "403":
          description: Actor or API token is not allowed to read dashboards
        "404":
          description: Project not found
    post:
      tags: [dashboards]
      operationId: createDashboard
      description: Creates a dashboard for a project using validated title, description, and owner metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardCreate"
      responses:
        "201":
          description: Created dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "403":
          description: Actor or API token is not allowed to manage dashboards
        "404":
          description: Project not found
  /api/v1/dashboards/{dashboardId}:
    get:
      tags: [dashboards]
      operationId: getDashboard
      description: Reads one dashboard with its widget definitions after project and actor authorization.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard with widgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "403":
          description: Actor or API token is not allowed to read dashboards
        "404":
          description: Dashboard or project not found
    patch:
      tags: [dashboards]
      operationId: updateDashboard
      description: Updates dashboard metadata and layout fields without changing unrelated project data.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardPatch"
      responses:
        "200":
          description: Updated dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "403":
          description: Actor or API token is not allowed to manage dashboards
        "404":
          description: Dashboard or project not found
    delete:
      tags: [dashboards]
      operationId: deleteDashboard
      description: Deletes one dashboard after management permission checks and returns a redacted result.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Dashboard deleted
        "403":
          description: Actor or API token is not allowed to manage dashboards
        "404":
          description: Dashboard or project not found
  /api/v1/dashboards/{dashboardId}/widgets:
    get:
      tags: [dashboards]
      operationId: listDashboardWidgets
      description: Lists widget definitions for one dashboard in a bounded project-scoped response.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard widgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetList"
        "403":
          description: Actor or API token is not allowed to read dashboards
        "404":
          description: Dashboard or project not found
    post:
      tags: [dashboards]
      operationId: createDashboardWidget
      description: Creates a dashboard widget with validated query, type, position, and display settings.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetCreate"
      responses:
        "201":
          description: Created dashboard widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "403":
          description: Actor or API token is not allowed to manage dashboards
        "404":
          description: Dashboard or project not found
  /api/v1/dashboards/{dashboardId}/widgets/{widgetId}:
    patch:
      tags: [dashboards]
      operationId: updateDashboardWidget
      description: Updates one dashboard widget definition while preserving dashboard/project boundaries.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetPatch"
      responses:
        "200":
          description: Updated dashboard widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "403":
          description: Actor or API token is not allowed to manage dashboards
        "404":
          description: Widget, dashboard, or project not found
    delete:
      tags: [dashboards]
      operationId: deleteDashboardWidget
      description: Deletes one dashboard widget and returns a redacted confirmation payload.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema:
            type: string
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Widget deleted
        "403":
          description: Actor or API token is not allowed to manage dashboards
        "404":
          description: Widget, dashboard, or project not found
  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      description: Lists projects visible to the current user or local development token.
      responses:
        "200":
          description: Project list
        "403":
          description: Authentication is required when production project auth is enabled
    post:
      tags: [projects]
      operationId: createProject
      description: Creates a project shell with key, display name, and default local settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Created project
        "400":
          description: Invalid project key or name
        "403":
          description: Authentication is required when production project auth is enabled
        "409":
          description: A project with the same normalized key already exists
  /api/v1/projects/{projectId}/settings/artifacts:
    get:
      tags: [projects]
      operationId: getProjectArtifactSettings
      description: Reads effective project artifact retention and cleanup settings. Defaults keep attachments for 14 days and stage cleanup before deletion.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project artifact settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectArtifactSettingsReadModel"
        "403":
          description: Actor or API token is not allowed to read project settings
        "404":
          description: Project not found
    patch:
      tags: [projects]
      operationId: updateProjectArtifactSettings
      description: Updates project artifact retention and cleanup settings used by new artifact descriptors.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectArtifactSettingsPatch"
      responses:
        "200":
          description: Updated project artifact settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectArtifactSettingsReadModel"
        "400":
          description: Invalid project artifact settings
        "403":
          description: Actor or API token is not allowed to manage project settings
        "404":
          description: Project not found
  /api/v1/projects/{projectId}/settings/access:
    get:
      tags: [projects, security]
      operationId: getProjectAccessSettings
      description: Reads project memberships, role assignments, API token metadata, visibility policies, link providers, and custom field mappings. API token secrets and hashes are never returned.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project access settings without raw token secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessSettingsReadModel"
        "403":
          description: Missing settings read scope or project access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Project not found
    patch:
      tags: [projects, security]
      operationId: updateProjectAccessSettings
      description: Updates project visibility, memberships, visibility policies, link providers, and custom field mappings. API tokens are managed through dedicated token endpoints.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectAccessSettingsPatch"
      responses:
        "200":
          description: Updated project access settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessSettingsReadModel"
        "400":
          description: Invalid access settings patch
        "403":
          description: Missing settings write scope or project access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Project not found
  /api/v1/projects/{projectId}/settings/access/tokens:
    post:
      tags: [projects, security]
      operationId: createProjectApiToken
      description: Creates a project-scoped API token. The raw secret is returned only in this response; subsequent reads expose only prefix, fingerprint, owner, scopes, status, and timestamps.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectApiTokenCreateRequest"
      responses:
        "201":
          description: Created API token with one-time secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectApiTokenCreateResponse"
        "400":
          description: Invalid token request
        "403":
          description: Missing settings write scope or project access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Project not found
  /api/v1/projects/{projectId}/settings/access/tokens/{tokenId}:
    delete:
      tags: [projects, security]
      operationId: revokeProjectApiToken
      description: Revokes a project-scoped API token. The response returns redacted token metadata only.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked API token metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectApiTokenRevokeResponse"
        "403":
          description: Missing settings write scope or project access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Project or API token not found
  /api/v1/projects/{projectId}/enterprise-access:
    get:
      tags: [security]
      operationId: getProjectEnterpriseAccess
      description: Reads redacted OIDC provider configuration and SCIM provisioning metadata for one project without returning credential hashes or secrets.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Redacted enterprise access configuration
        "403":
          description: Missing project settings read permission
        "404":
          description: Project not found
  /api/v1/projects/{projectId}/enterprise-access/oidc:
    post:
      tags: [security]
      operationId: createProjectOidcProvider
      description: Creates an OIDC provider configuration whose client secret is resolved only from the named server environment variable.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, issuer, clientId, clientSecretEnvVar]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                issuer: { type: string, format: uri, maxLength: 2000 }
                clientId: { type: string, minLength: 1, maxLength: 300 }
                clientSecretEnvVar: { type: string, minLength: 3, maxLength: 128 }
                scopes:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 100 }
                defaultRole: { $ref: "#/components/schemas/ProjectRole" }
                enabled: { type: boolean }
      responses:
        "201":
          description: OIDC provider configuration created
        "400":
          description: Provider configuration is invalid or unsafe
        "403":
          description: Missing enterprise access management permission
        "404":
          description: Project not found
  /api/v1/projects/{projectId}/enterprise-access/oidc/{providerId}:
    patch:
      tags: [security]
      operationId: updateProjectOidcProvider
      description: Updates an existing OIDC provider configuration while keeping client credentials outside persisted project data.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: providerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                issuer: { type: string, format: uri, maxLength: 2000 }
                clientId: { type: string, minLength: 1, maxLength: 300 }
                clientSecretEnvVar: { type: string, minLength: 3, maxLength: 128 }
                scopes:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 100 }
                defaultRole: { $ref: "#/components/schemas/ProjectRole" }
                enabled: { type: boolean }
      responses:
        "200":
          description: OIDC provider configuration updated
        "400":
          description: Provider configuration is invalid or unsafe
        "403":
          description: Missing enterprise access management permission
        "404":
          description: Project or OIDC provider not found
    delete:
      tags: [security]
      operationId: deleteProjectOidcProvider
      description: Deletes an OIDC provider configuration and records the administrative action in the security audit stream.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
        - name: providerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OIDC provider configuration deleted
        "403":
          description: Missing enterprise access management permission
        "404":
          description: Project or OIDC provider not found
  /api/v1/projects/{projectId}/enterprise-access/oidc/{providerId}/discover:
    post:
      tags: [security]
      operationId: discoverProjectOidcProvider
      description: Validates OIDC discovery metadata through bounded HTTPS and SSRF protections and returns only normalized public endpoints.
      parameters:
        - name: projectId
          in: path
          required: true
