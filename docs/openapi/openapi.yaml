            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Materialized fixture record page size.
        - name: cursor
          in: query
          schema:
            type: string
          description: Materialized fixture record offset cursor.
        - name: X-TestHistory-Scopes
          in: header
          required: false
          schema:
            type: string
            example: uploads:read,launches:read
          description: Optional actor-scoped read gate. When supplied, must include both `uploads:read` and `launches:read`.
        - name: X-TestHistory-Project-Scope
          in: header
          required: false
          schema:
            type: string
          description: Optional project scope. When scoped headers are supplied, must include the path project id or `*`.
        - name: X-TestHistory-Actor-Id
          in: header
          required: false
          schema:
            type: string
          description: Optional actor id echoed only as redacted actor-scoping metadata; never used as authorization proof.
      responses:
        "200":
          description: Paginated materialized synthetic archive diagnostic replay fixture reads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDiagnosticReplayMaterializedFixtureListResponse"
        "400":
          description: Invalid cursor or limit
        "403":
          description: Missing archive diagnostic replay materialized fixture read scope or project access when scoped headers are supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDiagnosticReplayMaterializedFixtureDenied"
        "404":
          description: Project not found
