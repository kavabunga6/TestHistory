            application/json:
              schema:
                $ref: "#/components/schemas/ChunkedUploadCompleteResponse"
        "404":
          description: Upload job or retained session payload not found
        "409":
          description: Upload job is not processable by this worker boundary
  /api/v1/uploads/{uploadId}/abort:
    post:
