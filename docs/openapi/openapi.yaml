                          type: array
                          items:
                            type: string
                        currentAffectedTestIds:
                          type: array
                          items:
                            type: string
                        occurrenceCount:
                          type: integer
                        firstSeenAt:
                          type: string
                        lastSeenAt:
                          type: string
                        firstSeenLaunchId:
                          type: string
                        lastSeenLaunchId:
                          type: string
                        results:
                          type: array
