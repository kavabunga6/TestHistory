                    passed: false
                    effectivePassed: true
                    actual: 1
                    effectiveActual: 0
                    op: lte
                    threshold: 0
                    explanation: "Critical labelled failures failed: actual 1 lte threshold 0."
                    affectedTestCaseIds: [case-critical]
                    affectedResultUuids: [critical-result]
                    effects:
