            maximum: 100
            default: 25
          description: Diagnostic page size.
        - name: cursor
          in: query
          schema:
            type: string
          description: Diagnostic offset cursor.
        - name: X-TestHistory-Scopes
          in: header
          required: false
          schema:
            type: string
            example: uploads:read,launches:read
          description: Optional actor-scoped read gate. When supplied, must include both `uploads:read` and `launches:read`.
        - name: X-TestHistory-Project-Scope
          in: header
          required: false
          schema:
            type: string
          description: Optional project scope. When scoped headers are supplied, must include the upload launch project id or `*`.
        - name: X-TestHistory-Actor-Id
          in: header
          required: false
          schema:
            type: string
          description: Optional actor id echoed only as redacted actor-scoping metadata; never used as authorization proof.
