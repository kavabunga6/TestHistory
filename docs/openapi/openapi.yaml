          type: boolean
        redacted:
          type: boolean
          enum: [true]
        partial:
          type: boolean
          description: True when optional launch/executor enrichment is unavailable for one or both compared points.
        unavailable:
          type: array
          description: Stable field names for optional enrichment that is partial or unavailable.
          items:
            type: string
            enum:
              [
                launch.branch,
                launch.buildNumber,
                launch.commitSha,
                executor.name,
                executor.type,
                executor.buildName,
                executor.buildUrl,
                executor.reportUrl
