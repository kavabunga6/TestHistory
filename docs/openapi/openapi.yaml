        - name: launchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityGateEvaluationRequest"
            example:
              rules:
                - metric: failed
                  op: lte
                  value: 1
                  severity: fail
              thresholds:
                criticalFailures:
                  op: lte
                  value: 0
                  severity: fail
                passRate:
                  op: gte
                  value: 95
                  severity: warn
              defectMutes:
                - id: mute-api-1
                  status: active
                  scope:
                    testCaseIds: [case-critical]
                  reason: Synthetic incident mute
                  origin:
                    type: actor
                    actorId: qa-api-agent
                  mutedAt: "2026-05-30T10:00:00.000Z"
                  affectedSignatureHashes: [signature-muted-api]
                  affectedTestIds: [case-critical]
