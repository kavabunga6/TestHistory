  /api/v1/projects/{projectId}/launches/compare:
    get:
      tags: [launches]
      operationId: compareProjectLaunches
      description: Compares the final automated result for each stable test identity across two launches in one project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: baseLaunchId
          in: query
          required: true
          schema:
            type: string
        - name: targetLaunchId
          in: query
          required: true
          schema:
            type: string
        - name: change
          in: query
          required: false
          schema:
            type: string
            enum: [new, removed, fixed, regressed, status-changed, unchanged]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Project-scoped launch metrics, deltas, classifications, and a paged test-level comparison.
          content:
            application/json:
              schema:
                type: object
                required:
                  [kind, projectId, base, target, summary, counterDeltas, metricDeltas, rows, page]
                properties:
                  kind:
                    type: string
                    const: launch-comparison
                  projectId:
                    type: string
                  base:
                    type: object
                    additionalProperties: true
                  target:
                    type: object
                    additionalProperties: true
                  summary:
                    type: object
                    additionalProperties:
                      type: integer
                  counterDeltas:
                    type: object
                    additionalProperties:
                      type: integer
                  metricDeltas:
                    type: object
                    additionalProperties: true
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  page:
                    type: object
                    additionalProperties: true
        "400":
          description: Launches are identical or outside the requested project.
        "403":
          description: Missing launch read scope or project visibility membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionDeniedError"
        "404":
          description: Project or compared launch not found.
